<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/logo_bp2.png')}}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css')}}">
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <nav>
        <div class="nav_barra">
            <div class="nav_logo">
                <a href="url_for('index')"><img src="{{ url_for('static', filename='images/logo_bp2.png')}}" alt=""></a>
            </div>
            <div class="nav_botones">
                <div class="nav_div">
                    <a class="nav_div_a" href="{{ url_for('index')}}">Inicio</a>
                </div>
                <div class="nav_div">
                    <button class="nav_div_btn" >Cursos</button>
                    <div class="nav_div_a_opciones">
                        <a class="nav_div_a" href="{{ url_for('curso_informacion') }}">Fundamentos</a>
                        <a class="nav_div_a" href="">Algebaaara</a>
                        <a class="nav_div_a" href="">Fisica</a>
                    </div>
                </div>
                <div class="nav_div">
                    <a class="nav_div_a" href="">Registrarse</a>
                </div>
                <div class="nav_div">
                    <a class="nav_div_a" href="">Contactanos</a>
                </div>
                <div class="nav_div">
                    <a class="nav_div_a" href="">Mas</a>
                </div>
            </div>  
        </div>
    </nav>
    {% block content %}
    {% endblock %}
    <footer>
        <div class="footer-email">
            <div class="footer-email__message">
                <div class="footer-email__message-img"><img src="{{ url_for('static', filename="/images/ver_mas.jpg")}}" alt=""></div>
                <div class="footer-email__message-text">
                    <div class="footer-email__message-text-title">RECIBÍ LOS CURSOS MAS RECIENTES.</div>
                    <div class="footer-email__message-text-text">Registra tu correo y recibpi los nuevos cursos de manera inmadiara.</div>
                </div>
            </div>
            <div class="footer-email__scope">
                <form action="">
                    <div class="footer-email__scope-inputext"><input type="text"></div>
                </form>
                <div class="footer-email__scope-suscribe">SUSCRIBIRSE</div>
            </div>
        </div>
        <div class="footer-content">
            <div class="footer-content__description"></div>
            <div class="footer-content__redes"></div>
            <div class="footer-content__cursos"></div>
            <div class="footer-content__mycount"></div>
        </div>
    </footer>
</body>
</html>
