services:
  db:
    image: mysql:8.0
    container_name: cursos
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cursosdb
      MYSQL_USER: cursos
      MYSQL_PASSWORD: cursos123
    ports:
      - "3307:3306"
    volumes:
      - ./Backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:Z
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cursos_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./Backend/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cursosdb
      MYSQL_USER: cursos
      MYSQL_PASSWORD: cursos123
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-me}
      
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
    command: python app.py

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cursos_frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "5000:5000"
    volumes:
      - ./Frontend:/app

    command: python app.py


volumes:
  db_data: